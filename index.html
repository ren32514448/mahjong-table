<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>麻雀 点数管理｜試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#f5fffb;background:#092b24}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 15px;font-weight:750;color:#fff;background:#176f58;touch-action:manipulation}button:disabled{opacity:.35}button:focus-visible,input:focus-visible{outline:3px solid #ffd36a}h1{font-size:26px;margin:0 0 9px}h2{font-size:19px;margin:0 0 14px}.screen{display:none}.screen.active{display:block}.formpage{max-width:720px;margin:auto;padding:25px 17px 55px}.panel{background:#12483b;border:1px solid #26775f;border-radius:20px;padding:20px;margin:16px 0}.muted{color:#a9c6bb;font-size:13px}.options{display:flex;gap:10px;flex-wrap:wrap}.options button{flex:1;background:#225647;border:2px solid #3b816a}.options button.selected{background:#0f8568;border-color:#f4d47a}.primary{background:#e2b64f;color:#18352d}.danger{background:#963e43}.secondary{background:#285a4e}.full{width:100%;margin-top:13px;padding:16px}label{display:block;font-weight:700;margin:13px 0 5px}input,select{width:100%;border:1px solid #55937f;border-radius:11px;padding:12px;background:#f8fffb;color:#173b31}.player-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:12px;color:#a8c8bc;line-height:1.6}.tag{display:inline-block;background:#f4c95f;color:#26372c;border-radius:8px;padding:3px 7px;font-weight:850}.summary{font-size:23px;font-weight:800;line-height:1.6}.table-screen{height:100dvh;min-height:360px;display:none;overflow:hidden;padding:7px 9px 9px}.table-screen.active{display:flex;flex-direction:column}.tableboard{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,1.3fr);grid-template-rows:minmax(0,1fr) minmax(0,1.75fr) minmax(0,1fr);gap:6px}.seat{background:linear-gradient(145deg,#105542,#0b4438);border:2px solid #23876c;border-radius:16px;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.seat.north{grid-column:2;grid-row:3}.seat.west{grid-column:1;grid-row:2}.seat.east{grid-column:3;grid-row:2}.seat.south{grid-column:2;grid-row:1}.seat .rot{display:flex;align-items:center;justify-content:space-around;gap:7px;width:100%;height:100%;padding:6px}.seat.south .rot{transform:rotate(180deg)}.seat.west .rot{width:calc(100dvh * .39);height:calc((100vw - 18px) * .29);position:absolute;transform:rotate(90deg)}.seat.east .rot{width:calc(100dvh * .39);height:calc((100vw - 18px) * .29);position:absolute;transform:rotate(-90deg)}.seat .identity{min-width:0;text-align:center}.seat .wind{font-size:12px;color:#b9e4d5;white-space:nowrap}.seat .score{font-size:clamp(18px,3.5vw,38px);font-weight:900;letter-spacing:-.5px;white-space:nowrap}.seat .mic{font-size:23px;background:#137b60;border:2px solid #31a783;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:none}.seat .reach{background:#145444;border:2px solid #f2c65c;color:#ffe08c;min-width:72px;padding:10px 8px;white-space:nowrap}.seat .reach.on{background:#f5c858;color:#24382e}.seat .dealer{background:#ffcd56;color:#233b30;font-weight:900;border-radius:8px;padding:5px 8px;position:absolute;right:6px;top:5px;font-size:12px}.seat.south .dealer{transform:rotate(180deg);right:auto;left:6px;top:auto;bottom:5px}.seat.west .dealer{transform:rotate(90deg);right:auto;left:6px}.seat.east .dealer{transform:rotate(-90deg)}.center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0}.centerbox{width:100%;border:2px solid #236e5b;border-radius:18px;padding:10px 4px;background:#07372d}.centerbox strong{font-size:clamp(17px,3vw,30px)}.centerbox div{font-size:clamp(11px,1.6vw,16px);margin-top:5px}.actions{display:flex;gap:6px;padding-top:7px;height:61px}.actions button{flex:1;min-width:0;padding:7px 3px;font-size:clamp(11px,1.9vw,17px);border:1px solid #2c8b70}.actions .red{background:#8e3439}.actions .orange{background:#92542e}.actions .blue{background:#2a638b}.actions .gray{background:#46675d}.overlay{position:fixed;inset:0;background:#021e19d9;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.dialog{background:#f5fbf8;color:#123c31;width:min(530px,96vw);max-height:95dvh;overflow:auto;border-radius:20px;padding:20px;box-shadow:0 12px 45px #0008}.dialog h2{margin:0 0 10px}.dialog input,.dialog select{border:1px solid #a5c5b7}.dialog button{margin-top:6px}.dialog .secondary{background:#d9eae2;color:#164535}.dialog .muted{color:#5b7569}.dialog .options button{color:#1e493b;background:#dcece5;border-color:#b5d1c3}.dialog .options button.selected{background:#a2dec8;border-color:#0d7d5c}.dialog .primary{background:#e4b94e}.dialog .danger{background:#9e4346;color:white}.dialog .fieldrow{display:flex;gap:9px}.dialog .fieldrow>*{flex:1;min-width:0}.dialog .buttons{display:flex;gap:9px;margin-top:12px}.dialog .buttons button{flex:1}.voiceicon{font-size:48px;text-align:center;color:#119a73;margin:12px}.warning{background:#fff2d1;color:#644b0b;padding:9px;border-radius:9px;font-size:13px}.log{font-size:12px;max-height:120px;overflow:auto;white-space:pre-wrap}.hide{display:none!important}@media(max-height:450px){.seat .rot{gap:3px}.seat .mic{width:40px;height:40px;font-size:19px}.seat .reach{padding:7px 6px;min-width:62px}.seat .score{font-size:clamp(17px,3.4vw,30px)}.actions{height:51px}.dialog{padding:12px}.dialog h2{font-size:17px}}@media(orientation:portrait){.table-screen:before{content:'横向きにすると4方向の画面が見やすくなります';position:fixed;z-index:5;top:0;left:0;right:0;text-align:center;background:#e5b956;color:#15362d;padding:3px;font-size:11px}.tableboard{padding-top:19px}.seat.west .rot,.seat.east .rot{width:45dvh;height:28vw}}

/* Ver.0.2.2: portrait tabletop layout; game logic untouched */
@media (orientation:portrait){
 .table-screen:before{content:none!important}
 .table-screen{height:100dvh;min-height:0;padding:4px 4px 4px 3px;flex-direction:row;gap:5px}
 .tableboard{order:2;flex:1;min-width:0;min-height:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.9fr) minmax(0,1fr);gap:5px}
 .seat{border-radius:12px;container-type:size;overflow:hidden}
 .seat.south{grid-column:1 / 4;grid-row:1}
 .seat.north{grid-column:1 / 4;grid-row:3}
 .seat.west{grid-column:1;grid-row:2}

 .centerbox strong{font-size:clamp(15px,3.5vw,24px)}
 .centerbox div{font-size:clamp(10px,2.4vw,14px);margin-top:3px}

 .seat.west .rot,.seat.east .rot{position:absolute;width:100cqh;height:100cqw;padding:4px;gap:4px}
 .seat .score{font-size:clamp(17px,5vw,30px)}
 .seat .wind{font-size:clamp(9px,2.3vw,13px)}
 .seat .mic{width:clamp(29px,8vw,42px);height:clamp(29px,8vw,42px);font-size:clamp(15px,4vw,22px)}
 .seat .reach{min-width:0;padding:6px 5px;font-size:clamp(10px,2.8vw,15px);border-radius:9px}
 .seat .dealer{font-size:10px;padding:3px 5px}
 .actions{order:1;flex:0 0 clamp(42px,9.5vw,62px);height:auto;min-height:0;display:flex;flex-direction:column;gap:4px;padding:0}
 .actions button{flex:1 1 0;min-height:0;padding:0 2px;border-radius:9px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:clamp(11px,3.1vw,17px);letter-spacing:1px}
 .dialog{max-height:90dvh}
}
</style></head><body>
<section id="home" class="screen active formpage"><h1>🀄 麻雀 点数管理</h1><p class="muted">対局の設定をしてスタート</p><div class="panel"><h2>人数</h2><div class="options" id="countBtns"><button data-n="4" class="selected">4人麻雀</button><button data-n="3">3人麻雀</button></div><h2 style="margin-top:22px">対局形式</h2><div class="options" id="lengthBtns"><button data-l="east" class="selected">東風戦</button><button data-l="south">半荘戦</button></div><button class="primary full" id="goSettings">次へ：プレイヤー設定 →</button></div><p class="note">試作版：対局データはこの端末内に保存されます。</p></section>
<section id="settings" class="screen formpage"><h1>プレイヤー・詳細設定</h1><p class="muted">名前と音声での呼び方を登録</p><div class="panel"><div id="playerInputs"></div><details style="margin-top:18px"><summary style="font-weight:800">⚙ 詳細ルール</summary><label>ロンの扱い</label><div class="options"><button class="selected">頭ハネ（初版）</button><button disabled>ダブルロン（将来）</button></div><p class="note">初版は頭ハネのみ対応。複数ロンは今後の拡張です。</p><label id="honbaRuleLabel">3人麻雀の本場加算</label><select id="honbaRule"><option value="300_100">ロン＋300点／ツモ各＋100点</option><option value="1000_1000">ハウスルール：ロン＋1,000点／ツモ各＋1,000点</option><option value="1000_500">ロン＋1,000点／ツモ各＋500点</option></select><p id="honbaRuleNote" class="note">4人麻雀はロン＋300点／ツモ各＋100点で固定。</p><label>開始持ち点</label><select id="startScore"><option value="25000">25,000点</option><option value="30000">30,000点</option><option value="35000">35,000点</option></select></details><label>起家（最初の親）</label><select id="firstDealer"></select><p class="note">起家を東家として、東→南→西→北の順に反時計回りに配置します。</p><button class="primary full" id="startGame">対局開始 →</button><button class="secondary full" data-screen="home">← 戻る</button></div></section>
<section id="game" class="screen table-screen"><div class="tableboard"><div class="seat north" id="seat-north"></div><div class="seat west" id="seat-west"></div><div class="center"><div class="centerbox"><strong id="roundLabel">東1局</strong><div id="honbaLabel">0本場</div><div id="potLabel">供託 0</div></div></div><div class="seat east" id="seat-east"></div><div class="seat south" id="seat-south"></div></div><div class="actions"><button class="red" id="ronBtn">ロン</button><button class="orange" id="tsumoBtn">ツモ</button><button class="blue" id="drawBtn">流局</button><button class="gray" id="undoBtn">取り消し</button><button id="nextBtn">局進行</button><button class="gray" id="menuBtn">メニュー</button></div></section>
<section id="finished" class="screen formpage"><h1>🏆 対局終了</h1><p class="muted">最終点数・順位</p><div class="panel" id="finalScores"></div><div class="panel"><button class="secondary full" id="backGame">対局画面に戻って修正</button><button class="primary full" id="again">同じ設定でもう一度対局</button><button class="secondary full" id="topBtn">トップに戻る</button></div></section>
<div id="overlay" class="overlay"><div class="dialog" id="dialog"></div></div>
<script>
'use strict';const $=id=>document.getElementById(id),STORAGE='mahjong-table-prototype-v1';let config={count:4,length:'east',start:25000,firstDealer:0,honbaRule:'300_100',names:['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],calls:['いち','に','さん','よん']};let game=null,history=[],recognizer=null,voiceSession=0;const fmt=n=>Number(n).toLocaleString('ja-JP');const clone=x=>JSON.parse(JSON.stringify(x));const directions=['east','south','west','north'],windNames=['東家','南家','西家','北家'];function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='game')render();}function save(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,config,game,history}));}catch(e){alert('保存に失敗しました。空き容量を確認してください。')}}function valid(g){if(!g||!Array.isArray(g.players)||g.players.length!==config.count)return false;return g.players.every(p=>Number.isInteger(p.score))&&g.players.reduce((a,p)=>a+p.score,0)+g.pot*1000===config.count*config.start;}function remember(){history.push(clone(game));if(history.length>150)history.shift();}function transact(fn){if(!game)return;const old=clone(game);try{fn();if(!valid(game))throw Error('持ち点と供託の合計が一致しません');history.push(old);save();render();}catch(e){game=old;alert('処理できません：'+e.message)}}function setupInputs(){let out='';for(let i=0;i<config.count;i++)out+=`<div class="player-edit"><div><label>プレイヤー${i+1} 名前</label><input id="name${i}" maxlength="18"></div><div><label>音声での呼び方</label><input id="call${i}" maxlength="18"></div></div>`;$('playerInputs').innerHTML=out;for(let i=0;i<config.count;i++){$('name'+i).value=config.names[i];$('call'+i).value=config.calls[i]}$('firstDealer').innerHTML=Array.from({length:config.count},(_,i)=>`<option value="${i}">プレイヤー${i+1}</option>`).join('');$('firstDealer').value=config.firstDealer<config.count?config.firstDealer:0;$('startScore').value=config.start;$('honbaRule').value=config.honbaRule||'300_100';updateHonbaRuleUI();}function updateHonbaRuleUI(){const isThree=config.count===3;$('honbaRule').disabled=!isThree;$('honbaRuleLabel').textContent=isThree?'3人麻雀の本場加算':'本場加算（4人麻雀は固定）';$('honbaRuleNote').textContent=isThree?'1本場あたりの追加支払い。対局開始後は変更できません。':'4人麻雀はロン＋300点／ツモ各＋100点で固定。';}function honbaRates(){if(config.count!==3)return {ron:300,tsumo:100};const r=({ '300_100':{ron:300,tsumo:100},'1000_500':{ron:1000,tsumo:500},'1000_1000':{ron:1000,tsumo:1000}})[config.honbaRule];return r||{ron:300,tsumo:100};}function ensurePlaying(){if(!game||game.phase!=='playing'){alert('この局は精算済みです。局進行か取り消しをしてください。');return false;}return true;}function captureConfig(){for(let i=0;i<config.count;i++){config.names[i]=$('name'+i).value.trim()||`プレイヤー${i+1}`;config.calls[i]=$('call'+i).value.trim()||config.names[i]}config.firstDealer=Number($('firstDealer').value);config.start=Number($('startScore').value);config.honbaRule=$('honbaRule').value;}function fresh(){game={players:Array.from({length:config.count},(_,i)=>({id:i,name:config.names[i],call:config.calls[i],score:config.start,riichi:false})),dealer:config.firstDealer,round:0,hand:1,honba:0,pot:0,phase:'playing',events:[]};history=[];save();render();}function seatId(wind){if(!game)return null;const order=['east','south','west','north'];const w=order.indexOf(wind);return w<config.count?(game.dealer+w)%config.count:null}function roundName(){const wind=['東','南','西','北'][Math.min(3,game.round)];return `${wind}${game.hand}局`;}function render(){if(!game)return;for(const w of directions){const id=seatId(w),node=$('seat-'+w);if(id===null){node.style.visibility='hidden';continue;}node.style.visibility='visible';const p=game.players[id];node.innerHTML=`<div class="rot"><button class="mic" data-mic="${id}" aria-label="${p.name}の音声入力">🎙</button><div class="identity"><div class="wind">${windNames[directions.indexOf(w)]} · <span class="pname"></span></div><div class="score">${fmt(p.score)}</div></div><button class="reach ${p.riichi?'on':''}" data-riichi="${id}">${p.riichi?'リーチ中':'リーチ'}</button></div>${id===game.dealer?'<span class="dealer">親</span>':''}`;node.querySelector('.pname').textContent=p.name;node.querySelector('.mic').disabled=game.phase!=='playing';node.querySelector('.reach').disabled=game.phase!=='playing'||p.riichi;} $('roundLabel').textContent=roundName();$('honbaLabel').textContent=game.honba+'本場';$('potLabel').textContent='供託 '+fmt(game.pot*1000);for(const id of ['ronBtn','tsumoBtn','drawBtn'])$(id).disabled=game.phase!=='playing';$('nextBtn').disabled=game.phase!=='settled';document.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>openVoice(Number(b.dataset.mic)));document.querySelectorAll('[data-riichi]').forEach(b=>b.onclick=()=>riichi(Number(b.dataset.riichi)));}function modal(html){$('dialog').innerHTML=html;$('overlay').classList.add('show');}function close(){voiceSession++;if(recognizer){try{recognizer.abort()}catch(e){}recognizer=null;}$('overlay').classList.remove('show');}function options(exclude){return game.players.filter(p=>p.id!==exclude).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function riichi(id){if(!ensurePlaying())return;const p=game.players[id];if(p.riichi)return modal(`<h2>リーチ済み</h2><p>${escapeHtml(p.name)}はリーチ済みです。</p><button class="secondary full" id="dismiss">閉じる</button>`),$('dismiss').onclick=close;if(p.score<1000)return alert('持ち点が1,000点未満です');modal(`<h2>リーチ宣言</h2><p>${escapeHtml(p.name)}：1,000点を供託に移します。</p><div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="confirmReach">リーチ確定</button></div>`);$('dismiss').onclick=close;$('confirmReach').onclick=()=>{if(!ensurePlaying())return;transact(()=>{if(game.phase!=='playing')throw Error('精算済みです');p.score-=1000;p.riichi=true;game.pot++});close()};}function amount(v){const n=Number(v);if(!Number.isInteger(n)||n<100||n>100000||n%100)throw Error('点数は100〜100,000の100点単位で入力してください');return n;}function winDialog(type,winner=null,prefill=null){if(!ensurePlaying())return;const isRon=type==='ron';modal(`<h2>${isRon?'ロン':'ツモ'}の精算</h2><label>和了者</label><select id="winnerSelect">${game.players.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select><div id="lossField"><label>放銃者</label><select id="loserSelect"></select></div><div id="ronField"><label>ロン点数（本場を除く）</label><input id="ronPoints" type="number" inputmode="numeric" value="8000"></div><div id="childField"><label>子の支払額（1人あたり）</label><input id="childPoints" type="number" inputmode="numeric" value="2000"></div><div id="parentField"><label id="parentText">親の支払額</label><input id="parentPoints" type="number" inputmode="numeric" value="4000"></div><div class="warning" id="previewPay">内容を入力すると精算額を確認できます。</div><div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="confirmWin">精算を確定</button></div>`);const w=$('winnerSelect');w.value=winner===null?game.dealer:winner;function update(){const id=Number(w.value),dealer=id===game.dealer;$('lossField').classList.toggle('hide',!isRon);$('ronField').classList.toggle('hide',!isRon);$('childField').classList.toggle('hide',isRon||dealer);$('parentField').classList.toggle('hide',isRon);$('parentText').textContent=dealer?'オール（他家1人あたり）':'親の支払額';const prev=$('loserSelect').value;$('loserSelect').innerHTML=options(id);if([...$('loserSelect').options].some(o=>o.value===prev))$('loserSelect').value=prev;try{$('previewPay').textContent=paymentText(type,id,Number($('loserSelect').value),Number($('ronPoints').value),Number($('childPoints').value),Number($('parentPoints').value));}catch(e){$('previewPay').textContent=e.message;}}w.onchange=update;['loserSelect','ronPoints','childPoints','parentPoints'].forEach(id=>$(id).oninput=update);update();if(prefill){if(prefill.loser!==undefined)$('loserSelect').value=String(prefill.loser);if(prefill.ron)$('ronPoints').value=prefill.ron;if(prefill.child)$('childPoints').value=prefill.child;if(prefill.parent)$('parentPoints').value=prefill.parent;}update();$('dismiss').onclick=close;$('confirmWin').onclick=()=>{if(!ensurePlaying())return;const id=Number(w.value),loser=Number($('loserSelect').value);let ron,child,parent;try{if(isRon)ron=amount($('ronPoints').value);else if(id===game.dealer)parent=amount($('parentPoints').value);else{child=amount($('childPoints').value);parent=amount($('parentPoints').value);}transact(()=>{if(game.phase!=='playing')throw Error('精算済みです');settle(type,id,loser,ron,child,parent)});close();}catch(e){alert(e.message)}};}function paymentText(type,winner,loser,ron,child,parent){const h=game.honba,rates=honbaRates();if(type==='ron'){amount(ron);return `${game.players[loser]?.name||'?'} → ${game.players[winner].name}：${fmt(ron+h*rates.ron)}点（供託 ${fmt(game.pot*1000)}点は別途獲得）`;}if(winner===game.dealer){amount(parent);return `他家各 ${fmt(parent+h*rates.tsumo)}点を支払う（供託は和了者へ）`;}amount(child);amount(parent);return `子 各${fmt(child+h*rates.tsumo)}点／親 ${fmt(parent+h*rates.tsumo)}点（供託は和了者へ）`;}function settle(type,winner,loser,ron,child,parent){if(game.phase!=='playing')throw Error('精算済みです');if(type==='ron'){if(winner===loser)throw Error('和了者と放銃者が同じです');const pay=ron+game.honba*honbaRates().ron;game.players[loser].score-=pay;game.players[winner].score+=pay;}else{for(const p of game.players){if(p.id===winner)continue;const pay=(winner===game.dealer?parent:p.id===game.dealer?parent:child)+game.honba*honbaRates().tsumo;p.score-=pay;game.players[winner].score+=pay;}}game.players[winner].score+=game.pot*1000;game.pot=0;game.players.forEach(p=>p.riichi=false);game.phase='settled';game.lastWin={winner,type};game.events.push({type,winner,loser,ron,child,parent,at:new Date().toISOString()});}function drawDialog(){if(!ensurePlaying())return;modal(`<h2>流局</h2><p>テンパイの人を選択してください。</p><div id="tenpaiChoices">${game.players.map(p=>`<label><input type="checkbox" value="${p.id}" style="width:auto"> ${escapeHtml(p.name)}</label>`).join('')}</div><p class="muted">4人：ノーテン罰符3,000点／3人：2,000点。全員テンパイ・全員ノーテンは移動なし。</p><div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="confirmDraw">流局確定</button></div>`);$('dismiss').onclick=close;$('confirmDraw').onclick=()=>{if(!ensurePlaying())return;const ids=[...$('tenpaiChoices').querySelectorAll('input:checked')].map(x=>Number(x.value));transact(()=>{if(game.phase!=='playing')throw Error('精算済みです');const n=ids.length,total= config.count===3?2000:3000;if(n>0&&n<config.count){const gain=total/n,loss=total/(config.count-n);if(!Number.isInteger(gain)||!Number.isInteger(loss))throw Error('罰符を均等に配分できません');for(const p of game.players)p.score+=ids.includes(p.id)?gain:-loss;}game.players.forEach(p=>p.riichi=false);game.honba++;game.phase='settled';game.lastWin=null;game.drawDealerTenpai=ids.includes(game.dealer);game.events.push({type:'draw',tenpai:ids,at:new Date().toISOString()});});close()};}function advance(){if(game.phase!=='settled')return alert('まずロン・ツモ・流局の精算を確定してください');const stays=game.lastWin?.winner===game.dealer||(game.lastWin===null&&game.drawDealerTenpai);modal(`<h2>次局へ進む</h2><p>${stays?'親は連荘します。':'親が移動します。'} 現在の局を確定して進めますか？</p><div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="advanceOk">局進行</button></div>`);$('dismiss').onclick=close;$('advanceOk').onclick=()=>{transact(()=>{if(stays){if(game.lastWin)game.honba++;}else{game.dealer=(game.dealer+1)%config.count;game.hand++;if(game.lastWin)game.honba=0;if(game.hand>config.count){game.hand=1;game.round++;}}game.phase='playing';game.lastWin=null;});close();if(game.round>=(config.length==='east'?1:2))endDialog();};}function endDialog(){modal(`<h2>対局終了の確認</h2><p>この対局を終了して、順位を表示しますか？</p><div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="finishOk">終了する</button></div>`);$('dismiss').onclick=close;$('finishOk').onclick=()=>{close();finish()};}function finish(){const rank=game.players.map(p=>({...p})).sort((a,b)=>b.score-a.score||a.id-b.id);$('finalScores').innerHTML=rank.map((p,i)=>`<div class="summary">${i+1}位　${escapeHtml(p.name)}　${fmt(p.score)}点</div>`).join('')+`<p class="note">供託：${fmt(game.pot*1000)}点（未精算の場合は残ります）</p>`;screen('finished');save();}function menu(){modal(`<h2>対局メニュー</h2><p class="muted">${roundName()} ／ 操作履歴 ${history.length}件</p><button class="secondary full" id="dismiss">対局に戻る</button><button class="secondary full" id="manualScore">点数を手動修正（合計維持）</button><button class="secondary full" id="finishMenu">対局終了へ</button><p class="note">対局データはこの端末のブラウザに自動保存されます。</p>`);$('dismiss').onclick=close;$('finishMenu').onclick=()=>{close();endDialog()};$('manualScore').onclick=manualScores;}function manualScores(){modal(`<h2>点数の手動修正</h2><p class="muted">合計が開始総点と一致するよう入力してください（供託を含む）。</p>${game.players.map(p=>`<label>${escapeHtml(p.name)}</label><input type="number" id="edit${p.id}" value="${p.score}" step="100">`).join('')}<div class="buttons"><button class="secondary" id="dismiss">戻る</button><button class="primary" id="applyScore">修正確定</button></div>`);$('dismiss').onclick=close;$('applyScore').onclick=()=>{const nums=game.players.map(p=>Number($('edit'+p.id).value));if(nums.some(n=>!Number.isInteger(n)||n%100))return alert('100点単位の整数で入力してください');if(nums.reduce((a,b)=>a+b,0)+game.pot*1000!==config.count*config.start)return alert('持ち点と供託の合計が一致しません');transact(()=>game.players.forEach((p,i)=>p.score=nums[i]));close()};}function openVoice(winner){if(!ensurePlaying())return;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;modal(`<h2>🎙 ${escapeHtml(game.players[winner].name)}の音声入力</h2><div class="voiceicon">🎙</div><p id="voiceStatus" style="text-align:center">マイクを押して話してください</p><p class="muted">例：ロン 8000 相手の名前 ／ ツモ 2000 4000 ／ ツモ 4000オール</p><button class="primary full" id="voiceStart" ${Recognition?'':'disabled'}>音声認識を開始</button><label>認識された文章（手入力も可）</label><input id="voiceText" placeholder="ロン8000 田中"><div class="buttons"><button class="secondary" id="dismiss">キャンセル</button><button class="primary" id="voiceParse">内容を確認</button></div>`);$('dismiss').onclick=close;if(!Recognition)$('voiceStatus').textContent='このブラウザでは音声認識が使えません。手入力できます。';$('voiceStart').onclick=()=>{if(!Recognition||recognizer)return;const token=++voiceSession;const r=new Recognition();recognizer=r;r.lang='ja-JP';r.continuous=false;r.interimResults=false;r.maxAlternatives=3;$('voiceStart').disabled=true;$('voiceStatus').textContent='聞き取り中…';r.onresult=e=>{if(token!==voiceSession)return;const candidates=[];for(let i=0;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++)candidates.push(e.results[i][j].transcript);const best=candidates.map(t=>({text:t,parsed:parseVoice(t,winner)})).sort((a,b)=>a.parsed.error.length-b.parsed.error.length)[0];$('voiceText').value=best?.text||'';$('voiceStatus').textContent='認識結果を確認してください';};r.onerror=e=>{if(token===voiceSession)$('voiceStatus').textContent='認識エラー：'+e.error+'（手入力もできます）'};r.onend=()=>{if(token===voiceSession){recognizer=null;$('voiceStart').disabled=false}};try{r.start()}catch(e){recognizer=null;$('voiceStart').disabled=false;$('voiceStatus').textContent=e.message}};$('voiceParse').onclick=()=>{const parsed=parseVoice($('voiceText').value,winner);if(parsed.error.length)return $('voiceStatus').textContent='確認が必要：'+parsed.error.join('／');close();winDialog(parsed.type,winner,parsed);};}function parseVoice(text,winner){const original=String(text||'').normalize('NFKC').replace(/論/g,'ロン').replace(/積も|自摸/g,'ツモ').replace(/([0-9])点/g,'$1');const s=original.replace(/[、。，,]/g,' ').trim();const compact=s.replace(/\s/g,'');const tsumo=/^(ツモ|つも|いつも|妻も|妻)/.test(compact),ron=/ロン/.test(compact);const type=ron?'ron':tsumo?'tsumo':null;const error=[];if(!type)error.push('ロン／ツモが不明');const nums=[...s.matchAll(/\d+/g)].map(m=>Number(m[0]));const other=game.players.filter(p=>p.id!==winner);const namePart=compact.replace(/^(ツモ|つも|いつも|妻も|妻|ロン)/,'').replace(/\d+/g,'').replace(/オール/g,'');const normalizeName=v=>String(v||'').normalize('NFKC').replace(/\s/g,'');const found=other.filter(p=>[p.call,p.name].some(name=>{const key=normalizeName(name);return key&&namePart===key;}));if(type==='ron'&&found.length!==1)error.push('放銃者が不明');if(type==='ron'&&nums.length!==1)error.push('ロン点数が不明');if(type==='tsumo'&&found.length)error.push('ツモにプレイヤー名があります');if(type==='tsumo'&&nums.length!==(winner===game.dealer?1:2))error.push('ツモ点数が不足');if(type==='tsumo'&&winner===game.dealer&&!compact.includes('オール'))error.push('親ツモのオールが不足');if(nums.some(n=>n<=0||n>100000||n%100))error.push('点数が不正');let rest=found.length===1?'':namePart;if(rest)error.push('未解釈の文字：'+rest);return {type,loser:found[0]?.id,ron:nums[0],child:nums[0],parent:nums[winner===game.dealer?0:1],error};}

$('countBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;config.count=Number(b.dataset.n);[...$('countBtns').children].forEach(x=>x.classList.toggle('selected',x===b));};$('lengthBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;config.length=b.dataset.l;[...$('lengthBtns').children].forEach(x=>x.classList.toggle('selected',x===b));};$('goSettings').onclick=()=>{setupInputs();screen('settings')};document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>screen(b.dataset.screen));$('startGame').onclick=()=>{if(game&&history.length&&!confirm('進行中の対局データを初期化して新しい対局を始めますか？'))return;captureConfig();fresh();screen('game')};$('ronBtn').onclick=()=>winDialog('ron');$('tsumoBtn').onclick=()=>winDialog('tsumo');$('drawBtn').onclick=drawDialog;$('nextBtn').onclick=advance;$('undoBtn').onclick=()=>{if(!history.length)return alert('取り消せる操作がありません');if(!confirm('直前の確定操作を取り消しますか？'))return;game=history.pop();save();render()};$('menuBtn').onclick=menu;$('backGame').onclick=()=>screen('game');$('again').onclick=()=>{if(!confirm('点数を初期化して、同じ設定で新しい対局を始めますか？'))return;fresh();screen('game')};$('topBtn').onclick=()=>screen('home');try{const data=JSON.parse(localStorage.getItem(STORAGE)||'null');if(data?.version===1&&data.config){config=data.config;if(data.game){if(valid(data.game)){game=data.game;history=Array.isArray(data.history)?data.history:[];const resume=document.createElement('button');resume.className='secondary full';resume.textContent='前回の対局を再開';resume.onclick=()=>screen('game');$('home').querySelector('.panel').appendChild(resume);}else{alert('保存データの点数整合性を確認できないため、自動復元しません。')}}}}catch(e){console.warn(e)}

</script></body></html>
